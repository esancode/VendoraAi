name: Deploy VendoraAI Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm run test
        continue-on-error: true # Continua o build mesmo se não houver testes configurados completamente por agora

      # Placeholder: Configure o Docker Buildx e Login do seu registry aqui
      # Exemplo para AWS ECR ou DockerHub
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3
      # 
      # - name: Login to DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Mude para true quando tiver o login configurado
          tags: vendora-backend:latest

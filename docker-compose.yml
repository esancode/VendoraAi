version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vendora-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendora
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vendora-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
